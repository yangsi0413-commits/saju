<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>디자인 미리보기</title>
  <style>
    :root { color-scheme: light; --bg: #eeece6; --ink: #1d1b18; --ink-2: #5b5852; --line: #d9d6cc; --accent: #7a4b2a; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif; }
    header { position: sticky; top: 0; z-index: 2; padding: 16px; background: rgba(238, 236, 230, .94); border-bottom: 1px solid var(--line); backdrop-filter: blur(6px); }
    h1 { margin: 0 0 4px; font-size: 20px; }
    p { margin: 0 0 12px; color: var(--ink-2); font-size: 14px; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
    .group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .group > span { font-size: 13px; color: var(--ink-2); margin-right: 2px; }
    button { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; }
    button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
    .grid { display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; padding: 24px 16px 48px; }
    .phone { display: grid; gap: 10px; justify-items: center; }
    .phone h2 { margin: 0; font-size: 16px; }
    .phone .desc { margin: 0; font-size: 13px; color: var(--ink-2); text-align: center; max-width: 300px; }
    .frame { overflow: hidden; border-radius: 28px; border: 8px solid #1d1b18; background: #1d1b18; box-shadow: 0 12px 30px rgba(0, 0, 0, .18); }
    .frame iframe { display: block; border: 0; width: 390px; height: 800px; transform-origin: 0 0; background: #fff; }
    .actions { display: flex; gap: 6px; }
    .actions a, .actions button { font-size: 13px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: #fff; color: var(--ink); text-decoration: none; }
    .actions .apply { background: var(--accent); border-color: var(--accent); color: #fff; }
    .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 10px 16px; border-radius: 10px; background: var(--ink); color: #fff; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <h1>디자인 미리보기 — 5가지 사주 테마</h1>
    <p>같은 사람(예시: 지민, 1990.5.15 10:30)의 화면을 다섯 디자인으로 나란히 비교합니다. 각 화면 안에서 스크롤·클릭도 됩니다.</p>
    <div class="controls">
      <div class="group" id="pages"><span>화면</span></div>
      <div class="group" id="zoom"><span>크기</span></div>
    </div>
  </header>

  <div class="grid" id="grid"></div>
  <div class="toast" id="toast" role="status"></div>

  <script>
    const THEMES = [
      { id: 'hanji', name: '한지·먹', desc: '한지 질감 위에 먹으로 쓴 글씨와 붉은 낙관. 고전적이고 차분한 명리서 느낌' },
      { id: 'dancheong', name: '궁궐 단청', desc: '녹청 바탕에 주홍·금·청 단청 띠무늬. 격식 있고 화려한 전통 궁궐 느낌' },
      { id: 'night', name: '밤하늘 천문', desc: '별이 뜬 남색 밤하늘과 금빛 글씨. 하늘의 운행을 읽는 신비로운 느낌' },
      { id: 'obang', name: '오방색', desc: '청·적·황·백·흑 다섯 방위색의 굵은 블록. 젊고 현대적인 느낌' },
      { id: 'bujeok', name: '부적', desc: '노란 괴황지에 붉은 주사 붓글씨와 이중 테두리. 강렬하고 신비로운 느낌' },
    ];
    const PAGES = [
      ['#/', '홈'], ['#/input/saju', '정보 입력'], ['#/result/saju', '종합풀이'], ['#/result/persona', '성격·성향'], ['#/result/today', '오늘의 운세'],
      ['#/result/year', '신년운세'], ['#/result/daeun', '대운'], ['#/result/compat', '궁합'], ['#/learn', '기초 배우기'],
    ];
    const ZOOMS = [[1, '100%'], [0.75, '75%'], [0.55, '55%']];
    // 다섯 화면이 한 줄에 들어가는 가장 큰 배율로 시작 (폰 너비 390 + 테두리 16 + 간격 24)
    const fits = (z) => 5 * (390 * z + 16 + 24) + 32 <= innerWidth;
    const state = { page: '#/', zoom: ZOOMS.map(([z]) => z).find(fits) || 0.55 };

    const grid = document.getElementById('grid');
    grid.innerHTML = THEMES.map(t => `
      <section class="phone">
        <h2>${t.name}</h2>
        <p class="desc">${t.desc}</p>
        <div class="frame"><iframe title="${t.name} 디자인 미리보기" data-theme="${t.id}" loading="lazy"></iframe></div>
        <div class="actions">
          <button type="button" class="apply" data-apply="${t.id}">이 디자인 적용</button>
          <a href="index.html?theme=${t.id}&demo" target="_blank" rel="noopener">크게 보기</a>
        </div>
      </section>`).join('');

    function buttons(id, list, key) {
      const el = document.getElementById(id);
      el.insertAdjacentHTML('beforeend', list.map(([v, label]) => `<button type="button" data-${key}="${v}">${label}</button>`).join(''));
      el.addEventListener('click', (e) => {
        const b = e.target.closest('button'); if (!b) return;
        state[key] = key === 'zoom' ? Number(b.dataset.zoom) : b.dataset.page;
        render();
      });
    }
    buttons('pages', PAGES, 'page');
    buttons('zoom', ZOOMS, 'zoom');

    function render() {
      document.querySelectorAll('[data-page]').forEach(b => b.setAttribute('aria-pressed', b.dataset.page === state.page));
      document.querySelectorAll('[data-zoom]').forEach(b => b.setAttribute('aria-pressed', Number(b.dataset.zoom) === state.zoom));
      document.querySelectorAll('iframe').forEach(f => {
        const src = `index.html?theme=${f.dataset.theme}&demo${state.page}`;
        if (f.getAttribute('src') !== src) f.src = src;
        f.style.transform = `scale(${state.zoom})`;
        f.parentElement.style.width = `${390 * state.zoom + 16}px`;
        f.parentElement.style.height = `${800 * state.zoom + 16}px`;
      });
    }

    const toast = document.getElementById('toast');
    grid.addEventListener('click', (e) => {
      const b = e.target.closest('[data-apply]'); if (!b) return;
      try { localStorage.setItem('saju.theme.v2', b.dataset.apply); } catch (err) { /* 저장 불가 환경 */ }
      const name = THEMES.find(t => t.id === b.dataset.apply).name;
      toast.innerHTML = `‘${name}’ 디자인을 적용했어요. <a href="index.html" style="color:#f5d27a">사이트로 이동 →</a>`;
      toast.style.pointerEvents = 'auto';
      toast.classList.add('show');
      setTimeout(() => { toast.classList.remove('show'); toast.style.pointerEvents = 'none'; }, 3500);
    });

    render();
  </script>
</body>
</html>
